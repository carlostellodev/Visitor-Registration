<!doctype html>
<html lang="">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Visitors Registration</title>

    <style>
      /* Estilos para el mensaje de noscript */
      .noscript-warning {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #fff;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        padding: 20px;
        text-align: center;
      }

      .noscript-warning__icon {
        font-size: 80px;
        margin-bottom: 20px;
        color: #ff5252;
      }

      .noscript-warning__title {
        font-size: 28px;
        font-weight: bold;
        color: #333;
        margin-bottom: 16px;
      }

      .noscript-warning__message {
        font-size: 18px;
        color: #666;
        max-width: 600px;
        line-height: 1.6;
        margin-bottom: 30px;
      }

      .noscript-warning__steps {
        text-align: left;
        background: #f5f5f5;
        padding: 20px;
        border-radius: 8px;
        max-width: 500px;
      }

      .noscript-warning__steps h3 {
        margin-top: 0;
        color: #333;
      }

      .noscript-warning__steps ol {
        margin: 10px 0;
        padding-left: 20px;
      }

      .noscript-warning__steps li {
        margin: 8px 0;
        color: #555;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div class="noscript-warning">
        <div class="noscript-warning__icon">⚠️</div>
        <h1 class="noscript-warning__title">JavaScript está deshabilitado</h1>
        <p class="noscript-warning__message">
          Esta aplicación requiere JavaScript para funcionar correctamente. Por favor, habilita
          JavaScript en tu navegador para continuar.
        </p>

        <div class="noscript-warning__steps">
          <h3>Cómo habilitar JavaScript:</h3>
          <ol>
            <li>
              <strong>Chrome/Edge:</strong> Configuración → Privacidad y seguridad → Configuración
              de sitios → JavaScript
            </li>
            <li>
              <strong>Firefox:</strong> Escribe "about:config" en la barra → Busca
              "javascript.enabled" → Actívalo
            </li>
            <li><strong>Safari:</strong> Preferencias → Seguridad → Habilitar JavaScript</li>
          </ol>
        </div>
      </div>
    </noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
